# Agent sync (CW-101): on every merge to main, each cloud/agents/<role>.md becomes the
# Managed Agents agent agents-<role>, so a session always uses the definitions of the commit
# on main. Without the ANTHROPIC_API_KEY secret the run skips (dry-run) or fails (live).
name: sync-agents

on:
  push:
    branches: [main]
    paths:
      - cloud/agents/**
      - preset/skills/**
      - preset/agents/**
      - cloud/settings.json
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a sync half way: it would leave skills uploaded and agents not updated.
concurrency:
  group: sync-agents
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node cloud/dispatcher/sync-agents.js
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
