# Agent sync (CW-101): on every merge to main, each cloud/agents/<role>.md becomes the
# Managed Agents agent agents-<role>, so a session always uses the definitions of the commit
# on main. Without the ANTHROPIC_API_KEY secret the run skips (dry-run) or fails (live).
# A manual run can be read-only (the read_only input): it only reads the platform and logs what the
# sync would create, adopt or update.
name: sync-agents

on:
  push:
    branches: [main]
    paths:
      - cloud/agents/**
      - preset/skills/**
      - preset/agents/**
      - cloud/settings.json
  workflow_dispatch:
    inputs:
      read_only:
        description: Only read the platform and log what the sync would change; write nothing
        type: boolean
        default: false

permissions:
  contents: read

# Never cancel a sync half way: it would leave skills uploaded and agents not updated.
concurrency:
  group: sync-agents
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node cloud/dispatcher/sync-agents.js
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # empty on a push run; only the string true turns read-only on
          SYNC_READ_ONLY: ${{ inputs.read_only }}
