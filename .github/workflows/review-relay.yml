# Relays a review to the merge gate (D50). `pull_request_review` runs the pull request's own
# copy of a workflow, so this one holds no permissions and runs no code: it only exists so that
# merge-gate, which runs from the default branch, starts on `workflow_run` and judges the review.
name: review-relay

on:
  pull_request_review:
    types: [submitted, edited, dismissed]

permissions: {}

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - run: echo "A review changed; merge-gate judges it."
