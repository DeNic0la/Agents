# The weekly scout run (cloud/dispatcher/scout-cli.js, CW-70 to CW-74): one scout session
# with a read-only token recommends at most scout.issuesPerRun issues; the agent identity
# files them and the dispatcher reports the run and its cost on the status issue. The
# schedule is cloud/settings.json scout.schedule ("weekly"); GitHub disables a scheduled
# workflow after 60 days without repository activity.
name: scout

on:
  schedule:
    - cron: '43 5 * * 1'
  workflow_dispatch:

# issues: write for the status issue and its comments; pull-requests: read for the merged
# list; actions: read for the running sessions (the reserve) and the stop switch. The agent
# identity's tokens, read-only for the session, are minted from the App's key inside the job.
permissions:
  contents: read
  issues: write
  pull-requests: read
  actions: read

concurrency:
  group: scout
  cancel-in-progress: false

jobs:
  scout:
    # The schedule or the owner; nobody else may spend the budget.
    if: github.event_name == 'schedule' || github.actor == github.repository_owner
    runs-on: ubuntu-latest
    # cloud/settings.json platform.sessionTimeoutMinutes (330) plus the time to file.
    timeout-minutes: 345
    steps:
      # A scheduled run's event has no repository; its ref is the default branch.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch || github.ref_name }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node cloud/dispatcher/scout-cli.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch || github.ref_name }}
          CLOUD_STOPPED: ${{ vars.CLOUD_STOPPED }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AGENT_APP_ID: ${{ vars.AGENT_APP_ID }}
          AGENT_APP_PRIVATE_KEY: ${{ secrets.AGENT_APP_PRIVATE_KEY }}
