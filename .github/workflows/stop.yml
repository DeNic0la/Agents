# The owner's stop switch (CW-84; cloud/dispatcher/control-cli.js). One run stops all agents:
# it turns off the dispatch, session and merge workflows, cancels their runs, interrupts every
# running agent session on the platform and records each one's cost on its issue. `resume`
# undoes it. merge-gate stays on: it is a required check and only reports.
name: stop
run-name: stop all agents

on:
  workflow_dispatch:

# actions: write to disable workflows and cancel their runs; issues: write for the cost
# comments; pull-requests and checks: read for the issue views (linked pull requests, their
# files and CI). The platform key interrupts the sessions.
permissions:
  contents: read
  issues: write
  actions: write
  pull-requests: read
  checks: read

concurrency:
  group: stop-resume
  cancel-in-progress: false

jobs:
  stop:
    # Only the owner stops and resumes the agents.
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node cloud/dispatcher/control-cli.js
        env:
          COMMAND: stop
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
