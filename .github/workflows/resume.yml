# Resumes the agents after `stop` (CW-84; cloud/dispatcher/control-cli.js): turns the
# dispatch, session and merge workflows on again and starts a full reconcile, which decides
# everything that changed while stopped and starts the agents the states call for.
name: resume
run-name: resume all agents

on:
  workflow_dispatch:

# actions: write to enable the workflows and start the dispatch run.
permissions:
  contents: read
  actions: write

concurrency:
  group: stop-resume
  cancel-in-progress: false

jobs:
  resume:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node cloud/dispatcher/control-cli.js
        env:
          COMMAND: resume
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          CLOUD_STOPPED: ${{ vars.CLOUD_STOPPED }}
