# The checkout pins the default branch on purpose. `pull_request_review` runs the PR's own copy of
# the workflow, and `pull_request_target` must never run PR code with a write token: the gate
# code always comes from the default branch, never from the pull request.
name: merge-gate

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, ready_for_review, labeled, unlabeled]
  pull_request_review:
    types: [submitted, edited, dismissed]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request to re-check
        required: true
        type: number

permissions:
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: merge-gate-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - run: node cloud/dispatcher/merge-gate.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
