# The merge gate: sets the `merge-gate` and `owner-merge` statuses
# (docs/specs/cloud-development-workflow-build.md, D17, D50). Every trigger runs this file from
# the default branch, so the gate code and its write token never come from a pull request:
# `pull_request_target` and `workflow_run` both use the default branch's workflow.
# Reviews arrive through review-relay, whose `pull_request_review` run has no permissions.
name: merge-gate

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, ready_for_review, labeled, unlabeled]
  workflow_run:
    workflows: [review-relay]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request to re-check
        required: true
        type: number

permissions:
  contents: read
  issues: read # the merge class and the dispatcher record of the issue a pull request closes (D17)
  pull-requests: read
  statuses: write

concurrency:
  group: merge-gate-${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha || inputs.pr }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - run: node cloud/dispatcher/merge-gate.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
